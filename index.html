<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Digital KPIs</title>
<link rel="manifest" href="./manifest.json">
<meta name="theme-color" content="#0f172a">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Digital KPIs">
<link rel="icon" type="image/png" sizes="192x192" href="./icons/icon-192.png">
<link rel="apple-touch-icon" href="./icons/icon-192.png">
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    height: 100dvh;
    overflow: hidden;
  }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #0f172a;
    color: #f1f5f9;
    display: flex;
    flex-direction: column;
  }
  .topbar {
    flex-shrink: 0;
    position: sticky;
    top: 0;
    z-index: 20;
    background: #0f172a;
  }
  header {
    padding: 20px 16px 0;
  }
  h1 {
    font-size: 1.4rem;
    margin-bottom: 4px;
  }
  p.subtitle {
    color: #94a3b8;
    font-size: 0.85rem;
    margin-bottom: 16px;
  }

  /* Barra de abas no estilo do Controle de Helppis */
  .tabs {
    position: relative;
    display: flex;
    gap: 28px;
    overflow-x: auto;
    border-bottom: 1px solid #1e293b;
    padding: 0 16px;
    flex-shrink: 0;
  }
  .tab {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
    background: none;
    border: none;
    text-decoration: none;
    color: #94a3b8;
    font-size: 0.9rem;
    font-weight: 600;
    font-family: inherit;
    white-space: nowrap;
    padding: 0 0 12px 0;
    flex-shrink: 0;
    cursor: pointer;
    transition: color 0.15s ease;
  }
  .tab .icon {
    font-size: 1.3rem;
    line-height: 1;
  }
  .tab.active {
    color: #f1f5f9;
  }
  .tab:not(.active):hover {
    color: #cbd5e1;
  }
  .indicator {
    position: absolute;
    bottom: 0;
    height: 3px;
    background: #3b82f6;
    border-radius: 2px;
    transition: left 0.25s ease, width 0.25s ease;
  }

  .content {
    flex: 1;
    position: relative;
    background: #ffffff;
  }
  .pane {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    border: none;
    display: none;
  }
  .pane.active {
    display: block;
  }
  .loading {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #64748b;
    font-size: 0.85rem;
    background: #0f172a;
  }

  /* Painel Helppi Loja */
  #panel-helppiloja {
    overflow-y: auto;
    background: #0f172a;
    color: #f1f5f9;
    padding: 16px;
  }
  .hl-toolbar {
    display: flex;
    align-items: flex-end;
    gap: 12px;
    flex-wrap: wrap;
    margin-bottom: 20px;
  }
  .hl-field label {
    display: block;
    font-size: 0.75rem;
    color: #94a3b8;
    margin-bottom: 4px;
  }
  .hl-field input[type="date"] {
    background: #1e293b;
    border: 1px solid #334155;
    color: #f1f5f9;
    padding: 8px 10px;
    border-radius: 8px;
    font-size: 0.9rem;
  }
  .hl-add-btn {
    background: #3b82f6;
    color: white;
    border: none;
    padding: 9px 16px;
    border-radius: 8px;
    font-weight: 600;
    font-size: 0.85rem;
    cursor: pointer;
  }
  .hl-add-btn:hover { background: #2563eb; }
  .hl-status {
    font-size: 0.75rem;
    color: #94a3b8;
    padding-bottom: 9px;
  }

  .hl-sheet {
    background: #1e293b;
    border-radius: 12px;
    overflow: hidden;
    max-width: 420px;
  }
  .hl-row {
    display: grid;
    grid-template-columns: 1fr 110px 34px;
    align-items: center;
    border-bottom: 1px solid #26334a;
  }
  .hl-row.hl-header {
    background: #263449;
  }
  .hl-row.hl-header .hl-label,
  .hl-row.hl-header .hl-qty {
    color: #94a3b8;
    font-size: 0.7rem;
    text-transform: uppercase;
    font-weight: 700;
  }
  .hl-row.hl-fixed .hl-label {
    font-weight: 700;
  }
  .hl-label {
    padding: 12px 14px;
    font-size: 0.9rem;
  }
  .hl-label input[type="text"] {
    width: 100%;
    background: transparent;
    border: none;
    color: #f1f5f9;
    font-size: 0.9rem;
    font-weight: 600;
    padding: 0;
  }
  .hl-qty {
    padding: 8px 10px;
  }
  .hl-qty input[type="number"] {
    width: 100%;
    background: #0f172a;
    border: 1px solid #334155;
    color: #f1f5f9;
    padding: 8px 10px;
    border-radius: 6px;
    font-size: 0.95rem;
    text-align: center;
  }
  .hl-row.hl-total .hl-qty input {
    border-color: #3b82f6;
    font-weight: 700;
    color: #60a5fa;
  }
  .hl-row.hl-total .hl-qty input[readonly] {
    background: #172033;
    cursor: default;
  }
  .hl-del {
    background: #ef4444;
    border: none;
    color: white;
    width: 26px;
    height: 26px;
    border-radius: 6px;
    cursor: pointer;
    font-size: 0.85rem;
    line-height: 1;
    margin: 0 auto;
    display: block;
  }
  .hl-del:hover { background: #dc2626; }
  .hl-add-hora {
    margin-top: 10px;
    background: none;
    border: 1px dashed #334155;
    color: #94a3b8;
    padding: 10px;
    border-radius: 8px;
    width: 100%;
    max-width: 420px;
    cursor: pointer;
    font-size: 0.85rem;
  }
  .hl-add-hora:hover { border-color: #3b82f6; color: #f1f5f9; }
  .hl-section-title {
    font-size: 0.7rem;
    text-transform: uppercase;
    color: #64748b;
    margin: 18px 0 6px;
    max-width: 420px;
  }

  /* Painel Checklist */
  #panel-checklist {
    overflow-y: auto;
    background: #0f172a;
    color: #f1f5f9;
    padding: 16px;
  }
  .ck-toolbar {
    display: flex;
    align-items: flex-end;
    gap: 12px;
    flex-wrap: wrap;
    margin-bottom: 14px;
  }
  .ck-field label {
    display: block;
    font-size: 0.75rem;
    color: #94a3b8;
    margin-bottom: 4px;
  }
  .ck-field input[type="date"],
  .ck-field input[type="text"] {
    background: #1e293b;
    border: 1px solid #334155;
    color: #f1f5f9;
    padding: 8px 10px;
    border-radius: 8px;
    font-size: 0.9rem;
  }
  .ck-field input[type="text"] {
    width: 160px;
  }
  .ck-status {
    font-size: 0.75rem;
    color: #94a3b8;
    padding-bottom: 9px;
  }
  .ck-subtabs {
    display: flex;
    gap: 8px;
    margin-bottom: 14px;
  }
  .ck-subtab {
    flex: 1;
    background: #1e293b;
    border: 1px solid #334155;
    color: #94a3b8;
    padding: 10px;
    border-radius: 8px;
    font-weight: 600;
    font-size: 0.85rem;
    cursor: pointer;
    text-align: center;
  }
  .ck-subtab.active {
    background: #3b82f6;
    border-color: #3b82f6;
    color: white;
  }
  .ck-progress {
    background: #1e293b;
    border-radius: 8px;
    height: 8px;
    overflow: hidden;
    margin-bottom: 16px;
    max-width: 420px;
  }
  .ck-progress-bar {
    height: 100%;
    background: #22c55e;
    transition: width 0.25s ease;
  }
  .ck-list {
    max-width: 420px;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .ck-item {
    background: #1e293b;
    border-radius: 10px;
    padding: 12px;
    border: 1px solid #26334a;
  }
  .ck-item.done {
    border-color: #22c55e33;
    background: #16241d;
  }
  .ck-item-row {
    display: flex;
    align-items: flex-start;
    gap: 10px;
  }
  .ck-checkbox {
    width: 22px;
    height: 22px;
    flex-shrink: 0;
    margin-top: 2px;
    accent-color: #22c55e;
    cursor: pointer;
  }
  .ck-item-text {
    flex: 1;
  }
  .ck-item-label {
    font-size: 0.9rem;
    font-weight: 600;
    line-height: 1.3;
  }
  .ck-item-meta {
    font-size: 0.7rem;
    color: #64748b;
    margin-top: 3px;
  }
  .ck-item-del {
    background: none;
    border: none;
    color: #475569;
    cursor: pointer;
    font-size: 0.9rem;
    flex-shrink: 0;
  }
  .ck-item-obs {
    width: 100%;
    margin-top: 8px;
    background: #0f172a;
    border: 1px solid #334155;
    color: #f1f5f9;
    padding: 8px 10px;
    border-radius: 6px;
    font-size: 0.82rem;
    font-family: inherit;
    resize: vertical;
    min-height: 34px;
  }
  .ck-add-item {
    margin-top: 10px;
    background: none;
    border: 1px dashed #334155;
    color: #94a3b8;
    padding: 10px;
    border-radius: 8px;
    width: 100%;
    max-width: 420px;
    cursor: pointer;
    font-size: 0.85rem;
  }
  .ck-add-item:hover { border-color: #3b82f6; color: #f1f5f9; }
  .ck-summary {
    font-size: 0.8rem;
    color: #94a3b8;
    margin-top: 12px;
    max-width: 420px;
  }

  /* Painel Ocorrências/Ruptura */
  #panel-ocorrencias {
    overflow-y: auto;
    background: #0f172a;
    color: #f1f5f9;
    padding: 16px;
  }
  .oc-toolbar {
    display: flex;
    align-items: flex-end;
    gap: 12px;
    flex-wrap: wrap;
    margin-bottom: 14px;
  }
  .oc-field label {
    display: block;
    font-size: 0.75rem;
    color: #94a3b8;
    margin-bottom: 4px;
  }
  .oc-field input[type="date"],
  .oc-field input[type="text"] {
    background: #1e293b;
    border: 1px solid #334155;
    color: #f1f5f9;
    padding: 8px 10px;
    border-radius: 8px;
    font-size: 0.9rem;
  }
  .oc-status {
    font-size: 0.75rem;
    color: #94a3b8;
    padding-bottom: 9px;
  }
  .oc-summary-row {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    margin-bottom: 16px;
    max-width: 420px;
  }
  .oc-chip {
    background: #1e293b;
    border: 1px solid #334155;
    border-radius: 20px;
    padding: 6px 12px;
    font-size: 0.75rem;
    color: #94a3b8;
  }
  .oc-chip b {
    color: #f1f5f9;
  }
  .oc-form {
    background: #1e293b;
    border-radius: 12px;
    padding: 14px;
    max-width: 420px;
    margin-bottom: 16px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .oc-form-row {
    display: flex;
    gap: 8px;
  }
  .oc-form input,
  .oc-form select,
  .oc-form textarea {
    background: #0f172a;
    border: 1px solid #334155;
    color: #f1f5f9;
    padding: 9px 10px;
    border-radius: 8px;
    font-size: 0.88rem;
    font-family: inherit;
    width: 100%;
  }
  .oc-form textarea {
    resize: vertical;
    min-height: 34px;
  }
  .oc-form select {
    appearance: none;
  }
  .oc-qtd {
    width: 90px !important;
    flex-shrink: 0;
  }
  .oc-add-btn {
    background: #3b82f6;
    color: white;
    border: none;
    padding: 10px;
    border-radius: 8px;
    font-weight: 600;
    font-size: 0.85rem;
    cursor: pointer;
  }
  .oc-add-btn:hover { background: #2563eb; }
  .oc-list {
    max-width: 420px;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .oc-item {
    background: #1e293b;
    border-radius: 10px;
    padding: 12px;
    border-left: 3px solid #64748b;
    display: flex;
    justify-content: space-between;
    gap: 10px;
  }
  .oc-item.motivo-ruptura { border-left-color: #ef4444; }
  .oc-item.motivo-avaria { border-left-color: #f59e0b; }
  .oc-item.motivo-vencido { border-left-color: #a855f7; }
  .oc-item.motivo-outro { border-left-color: #64748b; }
  .oc-item-produto {
    font-size: 0.9rem;
    font-weight: 600;
  }
  .oc-item-meta {
    font-size: 0.72rem;
    color: #94a3b8;
    margin-top: 3px;
  }
  .oc-item-obs {
    font-size: 0.78rem;
    color: #cbd5e1;
    margin-top: 5px;
    font-style: italic;
  }
  .oc-item-del {
    background: none;
    border: none;
    color: #475569;
    cursor: pointer;
    font-size: 0.9rem;
    flex-shrink: 0;
    height: fit-content;
  }
  .oc-empty {
    color: #64748b;
    font-size: 0.85rem;
    max-width: 420px;
  }
</style>
</head>
<body>
  <div class="topbar">
    <header>
      <h1>Digital KPIs</h1>
      <p class="subtitle">Toque em uma aba para carregar o sistema aqui mesmo</p>
    </header>

    <nav class="tabs" id="tabs">
      <button class="tab active" data-target="frame-helppis">
        <span class="icon">📁</span> Helppis
      </button>
      <button class="tab" data-target="frame-presenca">
        <span class="icon">🕐</span> Presença
      </button>
      <button class="tab" data-target="frame-dashboard">
        <span class="icon">📊</span> Dashboard
      </button>
      <button class="tab" data-target="frame-assai">
        <span class="icon">📈</span> Portal Assaí
      </button>
      <button class="tab" data-target="frame-escala">
        <span class="icon">📅</span> Escala
      </button>
      <button class="tab" data-target="frame-pedidos">
        <span class="icon">📦</span> Pedidos
      </button>
      <button class="tab" data-target="panel-helppiloja">
        <span class="icon">🛒</span> Helppi Loja
      </button>
      <button class="tab" data-target="panel-checklist">
        <span class="icon">✅</span> Checklist
      </button>
      <button class="tab" data-target="panel-ocorrencias">
        <span class="icon">⚠️</span> Ocorrências
      </button>
      <span class="indicator" id="indicator"></span>
    </nav>
  </div>

  <div class="content" id="content">
    <div class="loading" id="loading">Carregando...</div>
    <iframe class="pane active" id="frame-helppis" data-src="https://digital-kpis.github.io/Controle-Helppi-/"></iframe>
    <iframe class="pane" id="frame-presenca" data-src="https://digital-kpis.github.io/controle-presenca/index.html"></iframe>
    <iframe class="pane" id="frame-dashboard" data-src="https://digital-kpis.github.io/Vendas/"></iframe>
    <iframe class="pane" id="frame-assai" data-src="https://digital-kpis.github.io/portal-assai/"></iframe>
    <iframe class="pane" id="frame-escala" data-src="https://digital-kpis.github.io/escala-digital/"></iframe>
    <iframe class="pane" id="frame-pedidos" data-src="https://digital-kpis.github.io/controle-pedidos/"></iframe>

    <div class="pane" id="panel-helppiloja">
      <div class="hl-toolbar">
        <div class="hl-field">
          <label>Dia</label>
          <input type="date" id="hl-date">
        </div>
        <span id="hl-status" class="hl-status">🟡 Conectando…</span>
      </div>

      <div class="hl-sheet">
        <div class="hl-row hl-header">
          <div class="hl-label"></div>
          <div class="hl-qty">Quant.</div>
          <div></div>
        </div>
        <div class="hl-row hl-fixed">
          <div class="hl-label">Orçadas</div>
          <div class="hl-qty"><input type="number" id="hl-orcadas" min="0" value="0"></div>
          <div></div>
        </div>
        <div class="hl-row hl-fixed">
          <div class="hl-label">Canceladas</div>
          <div class="hl-qty"><input type="number" id="hl-canceladas" min="0" value="0"></div>
          <div></div>
        </div>
      </div>

      <div class="hl-section-title">Por horário</div>
      <div class="hl-sheet" id="hl-horas-sheet">
        <div id="hl-horas-body"></div>
        <div class="hl-row hl-total">
          <div class="hl-label">Total no dia</div>
          <div class="hl-qty"><input type="number" id="hl-total-horas" value="0" readonly></div>
          <div></div>
        </div>
      </div>
      <button class="hl-add-hora" id="hl-add-hora">+ Adicionar horário</button>

      <div class="hl-section-title">Situação</div>
      <div class="hl-sheet">
        <div class="hl-row hl-total">
          <div class="hl-label">Em aberto</div>
          <div class="hl-qty"><input type="number" id="hl-aberto" min="0" value="0"></div>
          <div></div>
        </div>
      </div>
    </div>

    <div class="pane" id="panel-checklist">
      <div class="ck-toolbar">
        <div class="ck-field">
          <label>Dia</label>
          <input type="date" id="ck-date">
        </div>
        <div class="ck-field">
          <label>Quem preenche</label>
          <input type="text" id="ck-colaborador" placeholder="Seu nome">
        </div>
        <span id="ck-status" class="ck-status">🟡 Conectando…</span>
      </div>

      <div class="ck-subtabs">
        <button class="ck-subtab active" data-turno="abertura">🌅 Abertura</button>
        <button class="ck-subtab" data-turno="fechamento">🌙 Fechamento</button>
      </div>

      <div class="ck-progress"><div class="ck-progress-bar" id="ck-progress-bar" style="width:0%"></div></div>

      <div class="ck-list" id="ck-list"></div>
      <button class="ck-add-item" id="ck-add-item">+ Adicionar item</button>

      <div class="ck-summary" id="ck-summary"></div>
    </div>

    <div class="pane" id="panel-ocorrencias">
      <div class="oc-toolbar">
        <div class="oc-field">
          <label>Dia</label>
          <input type="date" id="oc-date">
        </div>
        <div class="oc-field">
          <label>Quem registra</label>
          <input type="text" id="oc-colaborador" placeholder="Seu nome">
        </div>
        <span id="oc-status" class="oc-status">🟡 Conectando…</span>
      </div>

      <div class="oc-summary-row" id="oc-summary-row"></div>

      <div class="oc-form">
        <div class="oc-form-row">
          <input type="text" id="oc-produto" placeholder="Produto">
          <input type="number" id="oc-qtd" class="oc-qtd" min="1" value="1" placeholder="Qtd">
        </div>
        <select id="oc-motivo">
          <option value="ruptura">Ruptura</option>
          <option value="avaria">Avaria</option>
          <option value="vencido">Vencido</option>
          <option value="outro">Outro</option>
        </select>
        <textarea id="oc-obs" placeholder="Observação (opcional)"></textarea>
        <button class="oc-add-btn" id="oc-add-btn">+ Registrar ocorrência</button>
      </div>

      <div class="oc-list" id="oc-list"></div>
      <p class="oc-empty" id="oc-empty" style="display:none;">Nenhuma ocorrência registrada neste dia.</p>
    </div>
  </div>

  <script>
    const tabs = document.querySelectorAll(".tab");
    const panes = document.querySelectorAll(".pane");
    const loading = document.getElementById("loading");
    const indicator = document.getElementById("indicator");
    const tabsNav = document.getElementById("tabs");

    function moveIndicator(tab) {
      const navRect = tabsNav.getBoundingClientRect();
      const tabRect = tab.getBoundingClientRect();
      indicator.style.left = (tabRect.left - navRect.left + tabsNav.scrollLeft) + "px";
      indicator.style.width = tabRect.width + "px";
    }

    function loadFrame(pane) {
      if (pane.tagName !== "IFRAME") {
        loading.style.display = "none";
        return;
      }
      if (!pane.src && pane.dataset.src) {
        loading.style.display = "flex";
        pane.src = pane.dataset.src;
        pane.addEventListener("load", () => {
          loading.style.display = "none";
        }, { once: true });
      } else {
        loading.style.display = "none";
      }
    }

    tabs.forEach(tab => {
      tab.addEventListener("click", () => {
        tabs.forEach(t => t.classList.remove("active"));
        tab.classList.add("active");
        moveIndicator(tab);

        panes.forEach(p => p.classList.remove("active"));
        const target = document.getElementById(tab.dataset.target);
        target.classList.add("active");
        loadFrame(target);
      });
    });

    // Posiciona o indicador na aba ativa e carrega o conteúdo inicial
    window.addEventListener("load", () => {
      moveIndicator(document.querySelector(".tab.active"));
      loadFrame(document.querySelector(".pane.active"));
    });

    /* ===== Firebase (mesmo projeto do Escala Digital) ===== */
    const firebaseConfig = {
      apiKey: "AIzaSyD2qYaUrjyFoJgfNLRTBg-b2t9Yr9GSB3A",
      authDomain: "escala-dinamica.firebaseapp.com",
      databaseURL: "https://escala-dinamica-default-rtdb.firebaseio.com",
      projectId: "escala-dinamica",
      storageBucket: "escala-dinamica.firebasestorage.app",
      messagingSenderId: "896362898729",
      appId: "1:896362898729:web:443ef1f568fc709bf3c338"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    /* ===== Painel Helppi Loja ===== */
    (function () {
      const dateInput = document.getElementById("hl-date");
      const orcadasInput = document.getElementById("hl-orcadas");
      const canceladasInput = document.getElementById("hl-canceladas");
      const abertoInput = document.getElementById("hl-aberto");
      const horasBody = document.getElementById("hl-horas-body");
      const addHoraBtn = document.getElementById("hl-add-hora");
      const totalHorasInput = document.getElementById("hl-total-horas");
      const statusEl = document.getElementById("hl-status");

      const DEFAULT_HORAS = [
        { hora: "07H", qtd: "" },
        { hora: "10H", qtd: "" },
        { hora: "12H", qtd: "" },
        { hora: "14H", qtd: "" },
        { hora: "22H", qtd: "" },
        { hora: "23:30H", qtd: "" }
      ];

      let currentRef = null;
      let suppressUntil = 0; // ignora eco do próprio Firebase logo após escrever

      db.ref(".info/connected").on("value", snap => {
        statusEl.textContent = snap.val() ? "🟢 Sincronizado" : "🔴 Sem conexão";
      });

      function todayStr() {
        const d = new Date();
        const tz = d.getTimezoneOffset() * 60000;
        return new Date(d - tz).toISOString().slice(0, 10);
      }

      function dayKey(date) {
        return date; // formato YYYY-MM-DD, hífen é válido como chave no Firebase
      }

      function getHorasFromDOM() {
        return Array.from(horasBody.querySelectorAll(".hl-row")).map(row => ({
          hora: row.querySelector(".c-hora").value,
          qtd: row.querySelector(".c-qtd").value
        }));
      }

      function updateTotalHoras() {
        const total = getHorasFromDOM().reduce((sum, r) => sum + (parseFloat(r.qtd) || 0), 0);
        totalHorasInput.value = total;
      }

      function persist() {
        updateTotalHoras();
        if (!currentRef) return;
        const data = {
          orcadas: orcadasInput.value,
          canceladas: canceladasInput.value,
          aberto: abertoInput.value,
          horas: getHorasFromDOM()
        };
        suppressUntil = Date.now() + 1200;
        currentRef.set(data);
      }

      function addHoraRow(data) {
        data = data || { hora: "", qtd: "" };
        const row = document.createElement("div");
        row.className = "hl-row";
        row.innerHTML = `
          <div class="hl-label"><input type="text" class="c-hora" placeholder="Ex: 18H" value="${data.hora}"></div>
          <div class="hl-qty"><input type="number" class="c-qtd" min="0" value="${data.qtd}"></div>
          <div><button class="hl-del" title="Remover">✕</button></div>
        `;
        row.querySelectorAll("input").forEach(el => {
          el.addEventListener("input", persist);
          el.addEventListener("change", persist);
        });
        row.querySelector(".hl-del").addEventListener("click", () => {
          row.remove();
          persist();
        });
        horasBody.appendChild(row);
      }

      function renderFromData(data) {
        horasBody.innerHTML = "";
        if (data) {
          orcadasInput.value = data.orcadas || 0;
          canceladasInput.value = data.canceladas || 0;
          abertoInput.value = data.aberto || 0;
          (data.horas && data.horas.length ? data.horas : DEFAULT_HORAS).forEach(addHoraRow);
        } else {
          orcadasInput.value = 0;
          canceladasInput.value = 0;
          abertoInput.value = 0;
          DEFAULT_HORAS.forEach(addHoraRow);
        }
        updateTotalHoras();
      }

      function watchDay(date) {
        if (currentRef) currentRef.off();
        currentRef = db.ref("helppiLoja/" + dayKey(date));
        currentRef.on("value", snap => {
          // Ignora atualizações que vieram da própria escrita recente, para não
          // atrapalhar o usuário enquanto está digitando
          if (Date.now() < suppressUntil) return;
          const active = document.activeElement;
          const isEditingHere = active && (active.tagName === "INPUT") &&
            (active.id === "hl-orcadas" || active.id === "hl-canceladas" || active.id === "hl-aberto" || active.classList.contains("c-hora") || active.classList.contains("c-qtd"));
          if (isEditingHere) return;
          renderFromData(snap.val());
        });
      }

      [orcadasInput, canceladasInput, abertoInput].forEach(el => {
        el.addEventListener("input", persist);
        el.addEventListener("change", persist);
      });

      addHoraBtn.addEventListener("click", () => {
        addHoraRow();
        persist();
      });

      dateInput.addEventListener("change", () => {
        watchDay(dateInput.value);
      });

      dateInput.value = todayStr();
      watchDay(dateInput.value);
    })();

    /* ===== Painel Checklist ===== */
    (function () {
      const dateInput = document.getElementById("ck-date");
      const colaboradorInput = document.getElementById("ck-colaborador");
      const statusEl = document.getElementById("ck-status");
      const listEl = document.getElementById("ck-list");
      const addBtn = document.getElementById("ck-add-item");
      const progressBar = document.getElementById("ck-progress-bar");
      const summaryEl = document.getElementById("ck-summary");
      const subtabs = document.querySelectorAll(".ck-subtab");

      const DEFAULT_ITEMS = {
        abertura: [
          "Temperatura da câmara fria conferida e registrada",
          "Leitores/coletores ligados e funcionando",
          "Área de separação limpa e organizada",
          "App Parceiro / sistema online",
          "Equipe presente conforme escala do dia",
          "Embalagens e insumos disponíveis"
        ],
        fechamento: [
          "Câmara fria fechada e temperatura registrada",
          "Pedidos pendentes tratados/zerados",
          "Área de separação limpa",
          "Equipamentos desligados ou em carga",
          "Lixo removido da área",
          "Fechamento do turno realizado no sistema"
        ]
      };

      let currentTurno = "abertura";
      let currentRef = null;
      let suppressUntil = 0;

      db.ref(".info/connected").on("value", snap => {
        statusEl.textContent = snap.val() ? "🟢 Sincronizado" : "🔴 Sem conexão";
      });

      function todayStr() {
        const d = new Date();
        const tz = d.getTimezoneOffset() * 60000;
        return new Date(d - tz).toISOString().slice(0, 10);
      }

      function nowTime() {
        const d = new Date();
        return d.toLocaleTimeString("pt-BR", { hour: "2-digit", minute: "2-digit" });
      }

      function makeDefaultItems(turno) {
        return DEFAULT_ITEMS[turno].map((label, i) => ({
          id: turno + "-" + i + "-" + Date.now(),
          label,
          checked: false,
          time: "",
          colaborador: "",
          obs: ""
        }));
      }

      function getItemsFromDOM() {
        return Array.from(listEl.querySelectorAll(".ck-item")).map(el => ({
          id: el.dataset.id,
          label: el.querySelector(".ck-item-label").textContent,
          checked: el.querySelector(".ck-checkbox").checked,
          time: el.dataset.time || "",
          colaborador: el.dataset.colaborador || "",
          obs: el.querySelector(".ck-item-obs").value
        }));
      }

      function updateProgress() {
        const items = getItemsFromDOM();
        const done = items.filter(i => i.checked).length;
        const pct = items.length ? Math.round((done / items.length) * 100) : 0;
        progressBar.style.width = pct + "%";
        summaryEl.textContent = items.length
          ? `${done} de ${items.length} itens concluídos (${pct}%)`
          : "Nenhum item cadastrado ainda.";
      }

      function persist() {
        updateProgress();
        if (!currentRef) return;
        suppressUntil = Date.now() + 1200;
        currentRef.set({ items: getItemsFromDOM() });
      }

      function renderItem(item) {
        const el = document.createElement("div");
        el.className = "ck-item" + (item.checked ? " done" : "");
        el.dataset.id = item.id;
        el.dataset.time = item.time || "";
        el.dataset.colaborador = item.colaborador || "";
        el.innerHTML = `
          <div class="ck-item-row">
            <input type="checkbox" class="ck-checkbox" ${item.checked ? "checked" : ""}>
            <div class="ck-item-text">
              <div class="ck-item-label" contenteditable="true">${item.label}</div>
              <div class="ck-item-meta">${item.checked && item.time ? `✔ ${item.time}${item.colaborador ? " · " + item.colaborador : ""}` : "pendente"}</div>
            </div>
            <button class="ck-item-del" title="Remover">✕</button>
          </div>
          <textarea class="ck-item-obs" placeholder="Observação (opcional)">${item.obs || ""}</textarea>
        `;

        const checkbox = el.querySelector(".ck-checkbox");
        const meta = el.querySelector(".ck-item-meta");

        checkbox.addEventListener("change", () => {
          el.classList.toggle("done", checkbox.checked);
          if (checkbox.checked) {
            el.dataset.time = nowTime();
            el.dataset.colaborador = colaboradorInput.value || "";
            meta.textContent = `✔ ${el.dataset.time}${el.dataset.colaborador ? " · " + el.dataset.colaborador : ""}`;
          } else {
            el.dataset.time = "";
            meta.textContent = "pendente";
          }
          persist();
        });

        el.querySelector(".ck-item-label").addEventListener("blur", persist);
        el.querySelector(".ck-item-obs").addEventListener("change", persist);
        el.querySelector(".ck-item-del").addEventListener("click", () => {
          el.remove();
          persist();
        });

        listEl.appendChild(el);
      }

      function renderFromData(data, turno) {
        listEl.innerHTML = "";
        const items = (data && data.items && data.items.length) ? data.items : makeDefaultItems(turno);
        items.forEach(renderItem);
        updateProgress();
      }

      function watchDay(date, turno) {
        if (currentRef) currentRef.off();
        currentRef = db.ref("checklist/" + date + "/" + turno);
        currentRef.on("value", snap => {
          if (Date.now() < suppressUntil) return;
          const active = document.activeElement;
          const isEditingHere = active && listEl.contains(active);
          if (isEditingHere) return;
          renderFromData(snap.val(), turno);
        });
      }

      addBtn.addEventListener("click", () => {
        renderItem({
          id: "custom-" + Date.now(),
          label: "Novo item (toque para editar)",
          checked: false,
          time: "",
          colaborador: "",
          obs: ""
        });
        persist();
      });

      subtabs.forEach(tab => {
        tab.addEventListener("click", () => {
          subtabs.forEach(t => t.classList.remove("active"));
          tab.classList.add("active");
          currentTurno = tab.dataset.turno;
          watchDay(dateInput.value, currentTurno);
        });
      });

      dateInput.addEventListener("change", () => {
        watchDay(dateInput.value, currentTurno);
      });

      colaboradorInput.addEventListener("change", () => {
        localStorage.setItem("ck-colaborador", colaboradorInput.value);
      });
      colaboradorInput.value = localStorage.getItem("ck-colaborador") || "";

      dateInput.value = todayStr();
      watchDay(dateInput.value, currentTurno);
    })();

    /* ===== Painel Ocorrências/Ruptura ===== */
    (function () {
      const dateInput = document.getElementById("oc-date");
      const colaboradorInput = document.getElementById("oc-colaborador");
      const statusEl = document.getElementById("oc-status");
      const summaryRow = document.getElementById("oc-summary-row");
      const listEl = document.getElementById("oc-list");
      const emptyEl = document.getElementById("oc-empty");
      const produtoInput = document.getElementById("oc-produto");
      const qtdInput = document.getElementById("oc-qtd");
      const motivoSelect = document.getElementById("oc-motivo");
      const obsInput = document.getElementById("oc-obs");
      const addBtn = document.getElementById("oc-add-btn");

      const MOTIVO_LABEL = {
        ruptura: "Ruptura",
        avaria: "Avaria",
        vencido: "Vencido",
        outro: "Outro"
      };

      let currentRef = null;

      db.ref(".info/connected").on("value", snap => {
        statusEl.textContent = snap.val() ? "🟢 Sincronizado" : "🔴 Sem conexão";
      });

      function todayStr() {
        const d = new Date();
        const tz = d.getTimezoneOffset() * 60000;
        return new Date(d - tz).toISOString().slice(0, 10);
      }

      function nowTime() {
        return new Date().toLocaleTimeString("pt-BR", { hour: "2-digit", minute: "2-digit" });
      }

      function renderSummary(items) {
        const counts = { ruptura: 0, avaria: 0, vencido: 0, outro: 0 };
        items.forEach(i => { counts[i.motivo] = (counts[i.motivo] || 0) + (parseInt(i.qtd) || 0); });
        summaryRow.innerHTML = Object.keys(MOTIVO_LABEL).map(m =>
          `<span class="oc-chip">${MOTIVO_LABEL[m]}: <b>${counts[m] || 0}</b></span>`
        ).join("");
      }

      function renderList(items) {
        listEl.innerHTML = "";
        emptyEl.style.display = items.length ? "none" : "block";
        items.slice().reverse().forEach(item => {
          const el = document.createElement("div");
          el.className = "oc-item motivo-" + item.motivo;
          el.innerHTML = `
            <div>
              <div class="oc-item-produto">${item.produto} <span style="color:#94a3b8;font-weight:400;">× ${item.qtd}</span></div>
              <div class="oc-item-meta">${MOTIVO_LABEL[item.motivo] || item.motivo} · ${item.hora || ""}${item.colaborador ? " · " + item.colaborador : ""}</div>
              ${item.obs ? `<div class="oc-item-obs">"${item.obs}"</div>` : ""}
            </div>
            <button class="oc-item-del" title="Remover">✕</button>
          `;
          el.querySelector(".oc-item-del").addEventListener("click", () => removeItem(item.id));
          listEl.appendChild(el);
        });
        renderSummary(items);
      }

      function watchDay(date) {
        if (currentRef) currentRef.off();
        currentRef = db.ref("ocorrencias/" + date);
        currentRef.on("value", snap => {
          const data = snap.val() || {};
          const items = Object.keys(data).map(id => Object.assign({ id }, data[id]));
          items.sort((a, b) => (a.ts || 0) - (b.ts || 0));
          renderList(items);
        });
      }

      function addOcorrencia() {
        const produto = produtoInput.value.trim();
        if (!produto) {
          produtoInput.focus();
          return;
        }
        const entry = {
          produto,
          qtd: qtdInput.value || 1,
          motivo: motivoSelect.value,
          obs: obsInput.value.trim(),
          colaborador: colaboradorInput.value || "",
          hora: nowTime(),
          ts: Date.now()
        };
        db.ref("ocorrencias/" + dateInput.value).push(entry);
        produtoInput.value = "";
        qtdInput.value = 1;
        obsInput.value = "";
        produtoInput.focus();
      }

      function removeItem(id) {
        db.ref("ocorrencias/" + dateInput.value + "/" + id).remove();
      }

      addBtn.addEventListener("click", addOcorrencia);
      produtoInput.addEventListener("keydown", e => {
        if (e.key === "Enter") addOcorrencia();
      });

      dateInput.addEventListener("change", () => watchDay(dateInput.value));
      colaboradorInput.addEventListener("change", () => {
        localStorage.setItem("oc-colaborador", colaboradorInput.value);
      });
      colaboradorInput.value = localStorage.getItem("oc-colaborador") || "";

      dateInput.value = todayStr();
      watchDay(dateInput.value);
    })();

    // Registra o service worker para permitir instalar o app e abrir offline
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("./service-worker.js").catch(() => {});
      });
    }
  </script>
</body>
</html>
